<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuraLock</title>
  <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #d9d1c5;
      --paper: #f6f1e8;
      --card: #fffdf8;
      --accent: #0f6e56;
      --danger: #8c2f2f;
      --warn: #8a5a12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 8px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.03em; }
    h2 { font-size: 1rem; margin: 0 0 12px; }
    p { color: var(--muted); }
    .identity { font-size: 0.92rem; }
    main { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 16px; padding-bottom: 40px; }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    .stack { display: grid; gap: 16px; }
    form { display: grid; gap: 8px; }
    input, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 8px 10px;
    }
    textarea { min-height: 88px; resize: vertical; }
    button {
      background: var(--accent);
      color: white;
      border: 0;
      cursor: pointer;
    }
    button.quiet {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--line);
    }
    .turn { padding: 8px 0; border-top: 1px solid var(--line); }
    .turn strong { text-transform: capitalize; }
    .meta { color: var(--muted); font-size: 0.82rem; }
    .event { font-size: 0.88rem; padding: 8px 0; border-top: 1px solid var(--line); }
    .risk-high { color: var(--danger); }
    .risk-medium { color: var(--warn); }
    .error { color: var(--danger); min-height: 1.2em; }
    #auth-panel { max-width: 520px; margin: 24px auto; }
    #app-shell[hidden], #auth-panel[hidden] { display: none; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section id="auth-panel" hidden>
    <h2 id="auth-title">Sign in to NeuraLock</h2>
    <p id="auth-help">Use your NeuraLock account.</p>
    <form id="auth-form">
      <input id="auth-username" autocomplete="username" placeholder="Username" required>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password (12+ characters)" required>
      <input id="auth-org" placeholder="Organisation ID (NL0001–NL9999)" value="NL0001" pattern="NL[0-9]{4}" title="Use NL followed by four digits, such as NL0001." hidden>
      <button type="submit">Continue</button>
      <div class="error" id="auth-error"></div>
    </form>
  </section>
  <div id="app-shell" hidden>
  <header>
    <h1>NeuraLock</h1>
    <button id="logout" type="button" class="quiet">Sign out</button>
    <p class="identity" id="identity">Loading local identity…</p>
  </header>
  <main>
    <section>
      <h2>Chat</h2>
      <div id="transcript"></div>
      <form id="chat-form">
        <textarea id="message" placeholder="Ask a question" required></textarea>
        <button type="submit">Send</button>
        <div class="error" id="chat-error"></div>
      </form>
    </section>
    <div class="stack">
      <section>
        <h2>Documents</h2>
        <form id="doc-form">
          <input id="doc-title" placeholder="Title" required>
          <textarea id="doc-content" placeholder="Content" required></textarea>
          <label><input type="checkbox" value="employee" checked> employee</label>
          <label><input type="checkbox" value="manager"> manager</label>
          <label><input type="checkbox" value="admin" checked> admin</label>
          <button type="submit">Save document</button>
          <div class="error" id="doc-error"></div>
        </form>
        <div id="documents"></div>
      </section>
      <section id="user-admin" hidden>
        <h2>Create user</h2>
        <form id="user-form">
          <input id="new-username" placeholder="Username" minlength="3" required>
          <input id="new-password" type="password" placeholder="Temporary password (12+ characters)" minlength="12" required>
          <select id="new-role"><option value="employee">employee</option><option value="manager">manager</option><option value="admin">admin</option></select>
          <button type="submit">Create account</button>
          <div class="error" id="user-error"></div>
        </form>
      </section>
      <section>
        <h2>Security events</h2>
        <div class="meta" id="event-summary"></div>
        <label>Risk <select id="event-risk"><option value="">All</option><option>low</option><option>medium</option><option>high</option></select></label>
        <label>Action <select id="event-action"><option value="">All</option><option>answer</option><option>redact_then_answer</option><option>refuse_message</option><option>ask_rephrase</option></select></label>
        <div id="events"></div>
      </section>
    </div>
  </main>
  <script src="/ui/app.js" defer></script>
</div>
</body>
</html>
